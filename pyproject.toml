[project]
name = "iokit"
version = "0.6.0"
description = "Input Output Kit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Vladislav A. Proskurov", email = "rilshok@pm.me"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Archiving",
    "Topic :: System :: Archiving :: Compression",
    "Typing :: Typed",
]
dependencies = [
    "humanize>=4.9.0",
    "packaging>=23.0",
    "typing-extensions>=4.8.0",
    "xxhash>=3.4.1",
]


[project.optional-dependencies]
dev = [
    "iokit[lint,test,ultra]",
]
lint = [
    "mypy>=1.7.1",
    "ruff>=0.6.3",
    "types-python-dateutil>=2.8.19",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.31.0",
]
test = [
    "moto[s3,server]>=5.0.0",
    "pytest>=8.2.2",
    "pytest-cov==6.0.0",
    "pytest-xdist>=3.6.1",
]
ultra = [
    "cryptography>=41.0.7",
    "ipython>=8.0.0",
    "jsonlines>=4.0.0",
    "numpy>=1.21.1",
    "pandas>=1.5.3",
    "Pillow>=10.4.0",
    "python-dateutil>=2.8.2",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
    "requests>=2.32.3",
    "soundfile>=0.12.1",
    "torchaudio>=2.0.0",
    "boto3>=1.40.7",
    "botocore>=1.43.67",
]


[build-system]
requires = ["uv_build>=0.12.24,<0.14.0"]
build-backend = "uv_build"


[project.urls]
Homepage = "https://github.com/rilshok/iokit"
Documentation = "https://github.com/rilshok/iokit#readme"
Source = "https://github.com/rilshok/iokit"
Issues = "https://github.com/rilshok/iokit/issues"
Changelog = "https://github.com/rilshok/iokit/releases"


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test requires internet access",
]


[tool.mypy]
strict = true
python_version = "3.10"


[tool.vulture]
make_whitelist = true
sort_by_size = true
verbose = false
min_confidence = 100
paths = ["src/iokit"]


[tool.ruff]
line-length = 100


[tool.ruff.format]
docstring-code-format = true


[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001",
    "D203",
    "D213",
    "F403",
    "PLR2004",
    "RUF100",
]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]


[tool.coverage.run]
source = ["iokit"]
branch = true
omit = ["tests/*"]


[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
